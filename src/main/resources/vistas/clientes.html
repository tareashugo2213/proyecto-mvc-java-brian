<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Bryann</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Gestión MVC - Bryann</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/productos">Productos</a>
            <a class="nav-link active" href="/clientes">Clientes</a>
            <a class="nav-link" href="/empleados">Empleados</a>
        </div>
    </div>
</nav>
<div class="container mt-5">
    <h2 class="mb-4 text-dark">Lista de Clientes</h2>
    <table class="table table-striped table-bordered bg-white shadow-sm">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Nombre Completo</th>
            <th>Correo Electrónico</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.nombreCompleto}"></td>
            <td th:text="${c.correo}"></td>
        </tr>
        </tbody>
    </table>
    <a href="/" class="btn btn-secondary mt-3">Volver al Inicio</a>
</div>
</body>
</html>
